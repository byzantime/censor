[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "censor"
version = "0.1.0"
description = "Strip comments (and optionally docstrings) from Python code — fast, and provably incapable of touching anything else."
readme = "README.md"
requires-python = ">=3.9"
keywords = ["comments", "docstrings", "strip", "cleanup", "source"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
censor = "censor._cli:main"

[dependency-groups]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/censor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
